[package]
name = "card-forge"
version = "0.2.0"
edition = "2024"
description = "A lightweight SillyTavern character card editor with image link caching"
license = "GPL-3.0-only"
repository = "https://github.com/numb747/card-forge"
readme = "README.md"
keywords = ["sillytavern", "character-card", "egui", "tavern"]
categories = ["gui"]

[dependencies]
base64 = "0.23.1"
crc32fast = "1.5.2"
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.36.2", features = ["file", "image"] }
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
regex = "1.13.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
ureq = "3.4.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
